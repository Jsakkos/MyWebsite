<!doctype html>
<!--
  Template for public/og-image.png (the link-preview card).
  Regenerate: open this file in a Chromium-based browser at a 1200x630 viewport and
  screenshot it, e.g. with Playwright: page.setViewportSize({width:1200,height:630}),
  page.setContent(<this file>), page.screenshot({path:"public/og-image.png"}).
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { background: #fbf8f1; color: #23201b; font-family: Inter, sans-serif; display: flex; }
  .card { box-sizing: border-box; width: 100%; padding: 72px 84px; display: flex; flex-direction: column; justify-content: space-between; border-left: 14px solid #2f6b4f; }
  .label { font-family: Newsreader, serif; font-style: italic; color: #2f6b4f; font-size: 30px; }
  h1 { font-family: Newsreader, serif; font-weight: 400; font-size: 64px; line-height: 1.12; letter-spacing: -0.01em; margin: 18px 0 0; max-width: 980px; }
  h1 em { color: #2f6b4f; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid #e3dccd; padding-top: 24px; font-size: 26px; color: #4a453c; }
  .name { font-family: Newsreader, serif; font-size: 34px; color: #23201b; }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="label">Staff Engineer, Spatial Genomics R&amp;D</div>
      <h1>I turn biology into products by building <em>the instruments, software, and processes in between.</em></h1>
    </div>
    <div class="foot">
      <span class="name">Jonathan Sakkos</span>
      <span>jonathanksakkos.com</span>
    </div>
  </div>
</body>
</html>
